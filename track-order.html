<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071827">
<title>Track your order | Daksh Dry Cleaners</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="account.css">
<style>
body{background:#f2f6f7;color:#173244}.track-header{min-height:72px;background:#071827;display:flex;align-items:center;justify-content:space-between;padding:12px max(22px,calc((100% - 1120px)/2));gap:16px}.track-header img{width:164px;max-height:46px;object-fit:contain}.track-header a{color:#d9f5f7;text-decoration:none;font-size:12px;font-weight:700}.track-wrap{max-width:900px;margin:42px auto;padding:0 20px 60px}.track-intro{margin-bottom:22px}.track-kicker{color:#0b9aaa;font-size:10px;font-weight:800;letter-spacing:1.5px}.track-intro h1{font:800 clamp(27px,5vw,38px) Manrope;margin:8px 0}.track-intro p{color:#6e8390;font-size:13px;line-height:1.7}.track-card{background:white;border:1px solid #e1e9eb;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 25px #17394a08}.track-card h2{font:800 16px Manrope;margin:0 0 16px}.track-order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.track-reference{font-size:10px;color:#78909d;font-weight:800;letter-spacing:1px}.track-order-top h3{font-size:15px;margin:7px 0;color:#183448}.track-status{display:inline-flex;padding:7px 11px;border-radius:999px;background:#e8f8f8;color:#087e8c;font-size:10px;font-weight:800;white-space:nowrap}.track-meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:#718593;font-size:10px;margin:12px 0 18px}.journey{display:grid;gap:0}.journey-step{display:grid;grid-template-columns:28px 1fr;gap:11px;min-height:58px;position:relative}.journey-marker{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e8eff1;color:#82949d;font-size:11px;font-weight:800;z-index:1}.journey-step:not(:last-child):before{content:"";position:absolute;left:10px;top:22px;bottom:-1px;width:2px;background:#e3ebee}.journey-step.done .journey-marker,.journey-step.current .journey-marker{background:#23c4d3;color:#06212c}.journey-step.done:not(:last-child):before{background:#23c4d3}.journey-copy strong{display:block;font-size:12px;color:#243f50}.journey-copy small{display:block;color:#82939d;font-size:10px;line-height:1.5;margin-top:3px}.journey-step.current .journey-copy strong{color:#078392}.track-empty{text-align:center;padding:32px 16px}.track-empty-art{width:90px;height:75px;margin-bottom:12px}.track-empty h3{font:800 17px Manrope;margin:0 0 8px}.track-empty p{font-size:12px;color:#738793;line-height:1.6;max-width:390px;margin:0 auto 16px}.track-button{display:inline-block;text-decoration:none;border:0;border-radius:999px;background:#35d4e5;color:#06212c;padding:12px 18px;font-size:11px;font-weight:800}.track-help{font-size:11px;color:#738793;text-align:center;margin-top:20px}.track-error{color:#b54747;font-size:12px;padding:12px;background:#fff2f1;border-radius:10px}.track-loading{color:#6e8390;font-size:12px}@media(max-width:560px){.track-wrap{margin:26px auto}.track-card{padding:17px}.track-order-top{flex-direction:column}.track-header img{width:140px}}
</style>
</head>
<body>
<header class="track-header"><a href="index.html" aria-label="Daksh Dry Cleaners home"><img src="assets/daksh-logo.svg" alt="Daksh Dry Cleaners"></a><a href="dashboard.html">My dashboard ↗</a></header>
<main class="track-wrap">
<section class="track-intro"><div class="track-kicker">YOUR ORDER, YOUR PEACE OF MIND</div><h1>Track your order.</h1><p>See every update as your garments move through their care journey. Sign in to view orders linked securely to your account.</p></section>
<section class="track-card"><h2>Your order journey</h2><div id="trackingContent" class="track-loading" role="status">Loading your orders…</div></section>
<p class="track-help">Need help with an order? <a href="dashboard.html#support">Contact our support team</a>.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script><script src="track-order.js"></script>
</body></html>
